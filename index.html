<html lang="ko">
<head>

<title>배당반영</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --card-2:#faf8f3; --line:#e6e2d8;
    --text:#20222a; --muted:#6c695f; --dim:#98948a;
    --accent:#a9761f; --accent-soft:#f2e7cd;
    --ok:#2f8a57; --warn:#bd7a1c; --danger:#c2453f; --dh:#7b4fa3;
    --ok-bg:#e7f2ec; --warn-bg:#f7ecd9; --danger-bg:#f7e4e2; --dh-bg:#efe7f6;
    --shadow:0 8px 30px rgba(40,32,10,.10);
    --font-ui:"Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#13151a; --card:#1b1e25; --card-2:#20242c; --line:#2d313b;
    --text:#e9e7e2; --muted:#9a978f; --dim:#726f68; --accent:#d8ab53; --accent-soft:#392f19;
    --ok:#4aa96c; --warn:#d9922e; --danger:#d65a54; --dh:#a878cf;
    --ok-bg:#182a20; --warn-bg:#2e2413; --danger-bg:#301a18; --dh-bg:#241a30; --shadow:0 10px 34px rgba(0,0,0,.45);}}
  :root[data-theme="light"]{--bg:#f6f4ef;--card:#ffffff;--card-2:#faf8f3;--line:#e6e2d8;--text:#20222a;--muted:#6c695f;--dim:#98948a;--accent:#a9761f;--accent-soft:#f2e7cd;--ok:#2f8a57;--warn:#bd7a1c;--danger:#c2453f;--dh:#7b4fa3;--ok-bg:#e7f2ec;--warn-bg:#f7ecd9;--danger-bg:#f7e4e2;--dh-bg:#efe7f6;--shadow:0 8px 30px rgba(40,32,10,.10);}
  :root[data-theme="dark"]{--bg:#13151a;--card:#1b1e25;--card-2:#20242c;--line:#2d313b;--text:#e9e7e2;--muted:#9a978f;--dim:#726f68;--accent:#d8ab53;--accent-soft:#392f19;--ok:#4aa96c;--warn:#d9922e;--danger:#d65a54;--dh:#a878cf;--ok-bg:#182a20;--warn-bg:#2e2413;--danger-bg:#301a18;--dh-bg:#241a30;--shadow:0 10px 34px rgba(0,0,0,.45);}
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-text-size-adjust:100%;text-size-adjust:100%;line-height:1.4;touch-action:manipulation}
  .wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  header{display:flex;align-items:baseline;gap:8px;margin:2px 2px 10px}
  header h1{font-size:19px;margin:0;letter-spacing:-.01em} header .tag{font-size:11px;color:var(--accent);font-weight:800}
  .card,.load{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .load p{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.6}
  .load textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);color:var(--text);padding:10px;font-family:var(--font-mono);font-size:16px}
  .btn{border:none;border-radius:11px;background:var(--accent);color:#1a1206;font-weight:800;font-size:15px;padding:12px 16px;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:700}
  .btn.sm{padding:9px 12px;font-size:13px} .btn:active{transform:translateY(1px)}
  .home-lab{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:8px 2px 8px}
  .pick-meet{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card-2);color:var(--text);border-radius:11px;padding:13px 14px;margin-bottom:8px;font-weight:800;font-size:15px;cursor:pointer}
  .pick-meet .rg{color:var(--accent)} .pick-meet small{color:var(--muted);font-weight:600;font-size:12px;margin-left:auto}
  .pager{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
  .pager .nav{display:flex;gap:7px} .pager .pg{font-size:12px;color:var(--muted);font-weight:700}
  .rhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding:0 2px}
  .rhead b{font-size:18px} .rhead .g{color:var(--muted);font-size:12px} .rhead .t{color:var(--accent);font-size:11px;font-weight:800}
  .summary{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .summary .warn-line{font-size:13px;font-weight:800;margin-bottom:6px}
  .sw-ok{color:var(--ok)} .sw-warn{color:var(--warn)} .sw-danger{color:var(--danger)} .sw-none{color:var(--dim);font-weight:600}
  .summary .picks{display:flex;flex-wrap:wrap;gap:6px}
  .pill{font-family:var(--font-mono);font-weight:800;font-size:13px;border-radius:9px;padding:4px 9px;border:1px solid var(--line)}
  .pill.top{background:var(--accent);color:#1a1206;border-color:transparent} .pill.dh{background:var(--dh-bg);color:var(--dh);border-color:var(--dh)}
  .pill.y{background:transparent;color:var(--accent);border-color:var(--accent)}
  .pill.nb{background:transparent;color:var(--dim);border-color:var(--line);font-family:var(--font-ui);font-size:10.5px;font-weight:700}
  .pill .lbl{font-family:var(--font-ui);font-size:10px;font-weight:700;opacity:.8;margin-right:3px}
  .rows{display:flex;flex-direction:column;gap:5px}
  .row{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 9px}
  .row.top{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),transparent)} .row.dh{border-color:var(--dh)}
  /* Claude 픽 배지 — 축·복연1·복연2(추천 3두) / 복병(3착점수 4~9위에서 고른 2두) */
  .row .pk{flex:none;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap;font-family:var(--font-ui)}
  .row .pk.ax{background:var(--accent);color:#1a1206}
  .row .pk.y{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .row .pk.bh{background:var(--dh-bg);color:var(--dh);border:1px solid var(--dh)}
  .row .mrk{min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border-radius:6px;background:var(--card-2);color:var(--muted);font-family:var(--font-mono)}
  .row.top .mrk{background:var(--accent);color:#1a1206} .row.dh .mrk{background:var(--dh);color:#fff}
  .row .no{min-width:20px;text-align:center;font-family:var(--font-mono);font-weight:800;color:var(--accent)}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .row .nm small{color:var(--dim);font-size:10.5px;margin-left:5px}
  .row .nm small .spd{font-family:var(--font-mono);font-weight:800;margin:0 2px}
  .row .nm small .spd.fast{color:var(--ok)} .row .nm small .spd.slow{color:var(--dim)}
  .row .nm small .spd.t{color:var(--dh)} .row .nm small .spd.x{color:var(--warn)} .row .nm small .spd.none{color:var(--dim);font-weight:600}
  .rhead .d{color:var(--muted);font-size:11px;font-weight:700}
  .row .fin{font-size:10px;font-weight:800;color:#fff;background:var(--dim);border-radius:5px;padding:1px 5px;margin-left:4px}
  /* 후반 흐름 배지 — 🚀 후반 추월(추입) / 🔻 후반 추월당함(밀림) */
  .row .sg{flex:none;font-size:13px;line-height:1}
  .btn.ghost.on{background:var(--accent);color:#1a1206;border-color:transparent}
  /* 2026-08-15: 배당 입력칸(.odd)·단연 헤더(.oh)·비중 슬라이더(.wpanel/.wrow/…) CSS 제거 */
  .foot{color:var(--dim);font-size:10.5px;text-align:center;margin-top:20px;line-height:1.7}
</style>

<div class="wrap">

</div>

(function(){
  // iPhone 노치(safe-area) 대응: 뷰포트에 viewport-fit=cover만 보강(확대/축소는 그대로 허용)

    if(vp && !/viewport-fit/.test(vp.getAttribute('content')||'')){
      vp.setAttribute('content', vp.getAttribute('content')+',viewport-fit=cover');
    }
  }catch(e){}
  var $=function(s,el){return (el||document).querySelector(s);};
  var LS_LIB='baedang_lib';   // 2026-08-15: 배당 손입력 제거 — LS_OD('baedang_od')·비중슬라이더는 폐지됨

    try{ var v=localStorage.getItem(k); if(v!=null) return v; }catch(e){}
    try{ var v2=sessionStorage.getItem(k); if(v2!=null) return v2; }catch(e){}
    return null;
  }
  function rawSet(k,v){
    try{ localStorage.setItem(k,v); }catch(e){}
    try{ sessionStorage.setItem(k,v); }catch(e){}
  }
  function jget(k){ try{return JSON.parse(rawGet(k)||'{}');}catch(e){return {};} }
  function jset(k,v){ rawSet(k,JSON.stringify(v)); }

  //  ⚠️2026-08-07 변경: 예전엔 {L,O} 전체를 base64로 주소에 복사해 넣었음(3중 저장). 개최가 쌓일수록
  //    주소가 끝없이 길어져 12개최·100경주에서 55,000자에 달했음. lz-string으로 압축해도 15,000자라
  //    근본 해결이 아니어서 아예 싣지 않기로 함. 데이터는 localStorage(영구) + window.name(같은 탭)에 남음.
  //  · 받은 공유링크(#s=…)는 loadHash()가 읽어 들인 직후 여기서 주소를 깨끗이 지움.
  //  · 되돌리려면 아래 replaceState의 base 뒤에 압축 해시를 다시 붙이면 됨(decodeCode가 'L1'을 이미 해독).
  function saveState(){
    jset(LS_LIB,LIB);
    var payload = JSON.stringify({L:LIB});
    try{ history.replaceState(null,'', location.pathname + location.search); }
    catch(e){ try{ location.hash=''; }catch(e2){} }
    // window.name = 같은 탭에서 새로고침/재실행에도 잘 살아남는 저장(스토리지가 비워질 때 대비)
    try{ window.name = Object.keys(LIB).length ? ('BAEDANG1:'+payload) : ''; }catch(e){}
  }
  // window.name에 저장된 상태 복원
  function loadWinName(){
    try{
      var s=window.name||'';
      if(s.indexOf('BAEDANG1:')!==0) return false;
      var o=JSON.parse(s.slice(9));
      if(o&&o.L&&typeof o.L==='object'){ LIB=o.L; return Object.keys(LIB).length>0; }   // 옛 저장본의 o.O(배당)는 무시
    }catch(e){}
    return false;
  }
  // 노트북 공유 코드({blocks:...} 또는 {races:...})를 LIB에 병합
  function applyBlocks(o){
    var blocks = o.blocks || (o.races?[{d:o.d,r:o.r,races:o.races}]:null);
    if(!blocks || !blocks.length) return false;
    var ok=false;
    blocks.forEach(function(b){ if(b&&b.d&&b.r){ LIB[b.d+'|'+b.r]={d:b.d,r:b.r,races:b.races}; ok=true; } });
    return ok;
  }
  // 시작 시 해시에 데이터가 있으면 우선 복원(로컬 저장이 비어 있어도 목록이 뜨게 함)
  //  · {L,O}  = 폰에서 저장한 상태     · {blocks}/{races} = 노트북 공유 코드
  function loadHash(){
    try{
      var m=(location.hash||'').match(/[#&]s=([^&]+)/); if(!m) return false;
      var o=decodeCode(m[1]); if(!o) return false;
      if(o.L&&typeof o.L==='object'){
        // ⚠️병합(덮어쓰기 금지): 홈화면 아이콘·북마크는 예전 해시(옛 코드)를 물고 있어, 그대로 두면
        //   localStorage에 저장된 '최근 코드'를 옛 코드로 덮어써 사라짐 → localStorage(최신)를 우선하고 해시엔만 있는 것만 추가.
        var added=false;
        Object.keys(o.L).forEach(function(k){ if(!LIB[k]){ LIB[k]=o.L[k]; added=true; } });
        return added;   // 옛 링크의 o.O(배당)는 무시
      }
      if(applyBlocks(o)) return true;   // 노트북 공유코드({blocks}) — applyBlocks는 병합(같은 개최는 갱신)
    }catch(e){}
    return false;
  }
  loadHash();                                    // localStorage + 해시 병합(덮어쓰기 안 함)
  if(!Object.keys(LIB).length){ loadWinName(); }  // 둘 다 비면 window.name 복원
  if(Object.keys(LIB).length){ saveState(); }     // 병합 결과를 모든 저장소·현재 URL에 최신 상태로 재기록

  // ── 자동 수신(2026-08-15 신설) ───────────────────────────────────────────
  //  노트북 대시보드가 「📱 폰으로 전송」에서 이 저장소의 data.json 을 커밋한다.
  //  이 페이지는 열릴 때마다 같은 폴더의 data.json 을 읽어 새 것이면 자동 병합.
  //  → 카톡으로 링크 옮기고 붙여넣는 과정이 통째로 사라짐(옛 #s= 링크·코드도 계속 동작).
  //  · j.t = 노트북이 찍은 발행 시각. 이미 받은 t면 건너뛴다(전체삭제 후 되살아나는 것 방지).
  //    단 저장된 개최가 하나도 없으면 t가 같아도 받아온다(폰을 비운 뒤 다시 받는 경우).
  //  · file:// 로 열었거나 오프라인이면 조용히 넘어간다 — 저장된 데이터로 그대로 동작.
  var LS_T='baedang_t';
  function fetchRemote(force, cb){
    var done=function(ok,why){ try{ cb&&cb(ok,why); }catch(e){} };
    if(!/^https?:$/.test(location.protocol)) return done(false,'local');
    var url='data.json?t='+(new Date().getTime());
    var to=setTimeout(function(){ done(false,'timeout'); done=function(){}; }, 12000);
    fetch(url,{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    }).then(function(j){
      clearTimeout(to);
      if(!j||!j.code) throw new Error('empty');
      var last=rawGet(LS_T)||'';
      if(!force && j.t && j.t===last && Object.keys(LIB).length) return done(false,'same');
      var o=decodeCode(j.code);
      if(!o||!applyBlocks(o)) throw new Error('decode');
      if(j.t) rawSet(LS_T,j.t);
      saveState();
      done(true, j.t||'');
    }).catch(function(e){ clearTimeout(to); done(false, (e&&e.message)||'fail'); });
  }
  // 수동 새로고침 버튼용 — 상태를 버튼 글자로 보여준다
  function pullNow(btn){
    var old=btn?btn.textContent:'';
    if(btn){ btn.disabled=true; btn.textContent='받는 중…'; }
    fetchRemote(true, function(ok,why){
      if(btn){ btn.disabled=false; btn.textContent=old; }
      if(ok){ renderHome(); return; }
      if(why==='local') alert('이 페이지를 인터넷 주소로 열었을 때만 받아올 수 있어요.');
      else if(why==='same') { renderHome(); }
      else alert('새 데이터를 받지 못했어요.\n\n· 노트북에서 「📱 폰으로 전송」을 눌렀는지\n· 눌렀다면 30초~1분 뒤 다시 시도\n· 인터넷 연결 상태\n를 확인해 주세요.');
    });
  }

  var DEMO={d:'2026-07-11',r:'서울(데모)',races:[
    {n:3,g:'국6등급',tl:'실전(5·4·3등급)',
     h:[[3,'레이스디바',72],[1,'제주프린세스',68],[8,'골든워리어',66],[7,'스타비전',61],[4,'블루레인',58],[5,'윈드폴',55],[2,'다크호스',50],[6,'라스트콜',44]],
     p:[3,1,8], fin:[1,8,3]}
  ]};

  function mergeCode(code){
    var o=decodeCode(code);
    if(!o){ alert('코드를 읽을 수 없습니다.\n\n노트북 대시보드의 📱 폰으로 전송에서 링크를 다시 복사해 주세요.\n(링크 전체를 붙여넣어도 되고, 데이터 코드만 붙여넣어도 됩니다. 중간이 잘리지 않았는지 확인해 주세요.)'); return; }
    if(!applyBlocks(o)){ alert('경주 데이터가 없습니다.'); return; }
    saveState(); renderHome();
  }

  // ※QR 스캔(scanImageFile/jsQR 130KB 번들)은 2026-08-07 제거 — 개최 3개 이상이면 QR 한 장에 안 담겨
  //   노트북에서 생성 자체가 실패했음. 링크(#s=) 전송으로 대체.

  // ── 홈: 저장된 개최일·지역 선택 ──
  function renderHome(){
    var keys=Object.keys(LIB).sort().reverse();
    if(!keys.length){ renderLoad(); return; }
    var html='<div class="load"><div style="display:flex;gap:8px;margin-bottom:14px">'
      +'<button class="btn sm" id="pull">🔄 최신 받기</button><button class="btn ghost sm" id="add">＋ 코드</button><button class="btn ghost sm" id="demo">데모</button>'
      +'<button class="btn ghost sm" id="clr" style="margin-left:auto">전체삭제</button></div>'
      +'<div class="home-lab">개최일 · 지역 선택</div>';
    keys.forEach(function(k){ var b=LIB[k];
      html+='<button class="pick-meet" data-k="'+k+'">'+b.d+' <span class="rg">'+b.r+'</span><small>'+b.races.length+'경주</small></button>';
    });
    html+='</div>';
    $('#app').innerHTML=html;
    $('#pull').onclick=function(){ pullNow(this); };
    $('#add').onclick=renderLoad;
    $('#demo').onclick=function(){ CUR=DEMO; page=0; render(); };
    $('#clr').onclick=function(){ if(confirm('저장된 모든 개최일을 지울까요?')){ LIB={}; saveState(); renderHome(); } };
    document.querySelectorAll('.pick-meet').forEach(function(bn){ bn.onclick=function(){ CUR=LIB[bn.dataset.k]; page=0; render(); }; });
  }

  function renderLoad(){
    var backable=Object.keys(LIB).length>0;
    $('#app').innerHTML='<div class="load">'
      +(backable?'<button class="btn ghost sm" id="back" style="margin-bottom:12px">← 목록</button>':'')
      +'<p><b>오늘 경주 카드 불러오기</b><br>노트북에서 <b>📱 폰으로 전송</b>을 누르면 여기로 바로 올라옵니다. 아래 <b>🔄 최신 받기</b>만 누르세요.<br><span style="color:var(--dim);font-size:12px">※ 노트북에서 누른 직후엔 30초~1분 뒤에 받아집니다.</span></p>'
      +'<button class="btn" id="pull2" style="width:100%;margin-bottom:10px">🔄 최신 받기</button>'
      +'<button class="btn ghost" id="paste" style="width:100%;margin-bottom:10px">📋 복사한 링크·코드로 불러오기</button>'
      +'<details style="margin:2px 0 0"><summary style="cursor:pointer;color:var(--muted);font-size:12px;font-weight:700">직접 붙여넣기</summary>'
      +'<textarea id="code" placeholder="링크(https://…#s=…) 또는 코드를 붙여넣기 — 둘 다 됩니다"></textarea>'
      +'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="go">불러오기</button><button class="btn ghost" id="demo">데모 보기</button></div></details></div>';
    if(backable) $('#back').onclick=renderHome;
    var p2=$('#pull2'); if(p2) p2.onclick=function(){ pullNow(this); };
    var pb=$('#paste');
    if(pb) pb.onclick=function(){
      if(navigator.clipboard&&navigator.clipboard.readText){
        navigator.clipboard.readText().then(function(t){ if(t&&t.trim()){ mergeCode(t); } else { alert('클립보드가 비어있어요. 링크나 코드를 길게 눌러 \'복사\'한 뒤 다시 눌러주세요.'); } },
          function(){ alert('클립보드 자동읽기가 막혀 있어요. 아래 칸을 길게 눌러 붙여넣기 후 [불러오기]를 눌러주세요.'); });
      } else { alert('이 브라우저는 자동읽기를 지원하지 않아요. 아래 칸에 직접 붙여넣어 주세요.'); }
    };
    $('#go').onclick=function(){ mergeCode(($('#code')&&$('#code').value)||''); };
    $('#demo').onclick=function(){ CUR=DEMO; page=0; render(); };
  }

  // ── (2026-08-15) 배당 손입력 제거 ─────────────────────────────────────────
  //  단승·연승 입력칸 / 비중 슬라이더 / 시장확률 재정렬 / 어긋남 경고를 모두 걷어냄.
  //  이유: 557경주 확정배당 회수율 검증에서 배당 기반 재배치의 엣지가 확인되지 않았고
  //        (100% 넘는 구간 없음), 경마장에서 매 경주 손으로 치는 품만 컸음.
  //  축·복연1·복연2·복병은 원래 배당과 무관한 Claude 예측값이라 그대로 유지된다.
  // Claude 픽(축·복연1·복연2 + 복병 2두) — 노트북 예측 결과. 이 화면의 유일한 추천 근거.
  function cpicks(race){
    var p=(race&&race.p)||[], b=(race&&race.bh)||[];
    var n=function(x){ return (x!=null&&x!=='')?Number(x):null; };
    return {ax:n(p[0]), y1:n(p[1]), y2:n(p[2]),
            bh:b.map(n).filter(function(x){return x!=null;})};
  }
  function summaryHtml(cp){
    if(!(cp && cp.ax!=null)) return '<div class="warn-line sw-none">이 경주는 노트북 예측이 없습니다 — 아래는 전략점수 순입니다</div>';
    return '<div class="picks">'
      +'<span class="pill top"><span class="lbl">축</span>'+cp.ax+'</span>'
      +(cp.y1!=null?'<span class="pill y"><span class="lbl">복연1</span>'+cp.y1+'</span>':'')
      +(cp.y2!=null?'<span class="pill y"><span class="lbl">복연2</span>'+cp.y2+'</span>':'')
      +(cp.bh.length?cp.bh.map(function(n){return '<span class="pill dh"><span class="lbl">복병</span>'+n+'</span>';}).join('')
                    :'<span class="pill nb">복병 없음 · 노트북에서 재예측</span>')
      +'</div>';
  }

  function render(){
    if(!CUR){ renderHome(); return; }
    var races=CUR.races||[]; if(!races.length){ renderHome(); return; }
    if(page<0)page=0; if(page>=races.length)page=races.length-1;
    var race=races[page];
    var finRank={}; (race.fin||[]).forEach(function(n,i){ if(i<3) finRank[n]=i+1; });
    // 행 강조 = Claude 픽(축·복연1·복연2 / 복병). 예측이 안 온 경주는 강조 없이 점수 순만 표시.
    var cp=cpicks(race), tset={}, dset={}, pkLab={};
    if(cp.ax!=null){
      tset[cp.ax]=1; pkLab[cp.ax]=['축','ax'];
      if(cp.y1!=null){ tset[cp.y1]=1; pkLab[cp.y1]=['복연1','y']; }
      if(cp.y2!=null){ tset[cp.y2]=1; pkLab[cp.y2]=['복연2','y']; }
      cp.bh.forEach(function(n){ dset[n]=1; pkLab[n]=['복병','bh']; });
    }
    var horses=race.h.slice().sort(function(a,b){ return b[2]-a[2]; });   // 전략점수 순
    var rp=(race.rp10!=null?race.rp10/10:(race.rp!=null?race.rp:null));   // 이 경주 기준 100m 속도(rp10=×10 압축)
    var rowsHtml=horses.map(function(a,ri){
      var num=a[0],nm=a[1],sc=a[2];
      var cls=tset[num]?'top':dset[num]?'dh':'';
      var fin=finRank[num]?'<span class="fin">'+finRank[num]+'착</span>':'';
      // 속도 파싱: a[3]=압축문자열('86'=8.6·'t86'=주행심사·'x85'=다른거리·'n'=기록없음) / 하위호환(옛 숫자+a[4])
      var pace=null, psrc='', s3=(a.length>3?a[3]:null);
      if(s3!=null){
        if(typeof s3==='string'){ var c0=s3.charAt(0);
          if(c0==='t'||c0==='x'){ psrc=c0; pace=parseInt(s3.slice(1),10)/10; }
          else if(c0==='n'){ psrc='n'; }
          else { pace=parseInt(s3,10)/10; }
        } else { pace=(s3>20?s3/10:s3); psrc=(a.length>4?({trial:'t',xdist:'x',norace:'n',t:'t',x:'x',n:'n'}[a[4]]||''):''); if(psrc==='n')pace=null; }
      }
      var spd='';   // 초록=기준보다 빠름·흐림=느림 / 심=주행심사 / ≈=다른거리대체 / 기록없음
      if(pace!=null){
        if(psrc==='t') spd=' <b class="spd t">'+pace.toFixed(1)+'심</b>';
        else if(psrc==='x') spd=' <b class="spd x">≈'+pace.toFixed(1)+'</b>';
        else spd=' <b class="spd'+(rp!=null?(pace<=rp?' fast':' slow'):'')+'">'+pace.toFixed(1)+'</b>';
      } else if(psrc==='n'){ spd=' <b class="spd none">기록없음</b>'; }
      // 후반 흐름: a[4]가 숫자 1=🚀 후반 추월(추입·마무리형) / 2=🔻 후반 추월당함(밀림).
      //  옛 데이터는 a[4]가 문자열(paceSrc)이라 숫자일 때만 읽는다.
      var sg=(a.length>4&&typeof a[4]==='number')?a[4]:0;
      var sgb=sg===1?'<span class="sg up" title="후반 상위권 치고 오름(추입·마무리형)">🚀</span>'
             :sg===2?'<span class="sg dn" title="후반 추월당함(밀림·선행 이탈형)">🔻</span>':'';
      var pl=pkLab[num], pkb=pl?'<span class="pk '+pl[1]+'">'+pl[0]+'</span>':'';
      return '<div class="row '+cls+'" data-n="'+num+'"><span class="mrk">'+(ri+1)+'</span>'   // 전략점수 순위
        +'<span class="no">'+num+'</span><span class="nm">'+nm+fin+'<small>모델'+sc+spd+'</small></span>'+sgb+pkb+'</div>';
    }).join('');
    $('#app').innerHTML=
      '<div class="pager"><div class="pg">'+CUR.r+' '+CUR.d+' · '+(page+1)+'/'+races.length+'경주</div>'
      +'<div class="nav"><button class="btn ghost sm" id="home">≡ 목록</button><button class="btn ghost sm" id="prev">‹</button><button class="btn ghost sm" id="next">›</button></div></div>'
      +'<div class="rhead"><b>'+race.n+'R</b><span class="g">'+(race.g||'')+'</span>'+((race.dist||race.bl)?'<span class="d">'+(race.dist?race.dist+'m ':'')+(race.bl||'')+(rp!=null?' · 기준'+rp.toFixed(1):'')+'</span>':'')+'<span class="t">'+(race.tl||'')+'</span></div>'
      +'<div class="summary">'+summaryHtml(cp)+'</div>'
      +'<div class="rows">'+rowsHtml+'</div>';
    $('#home').onclick=renderHome;
    $('#prev').onclick=function(){ if(page>0){page--;render();} };
    $('#next').onclick=function(){ if(page<races.length-1){page++;render();} };
  }

  // 저장소가 나중에 비워질 때를 대비해, 창을 떠나기 직전 한 번 더 기록
  try{
    window.addEventListener('pagehide', function(){ try{ saveState(); }catch(e){} });
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden'){ try{ saveState(); }catch(e){} } });
  }catch(e){}

  // 시작: 저장된 게 있으면 홈(지역·날짜 선택), 없으면 불러오기
  if(Object.keys(LIB).length) renderHome(); else renderLoad();
  // 곧바로 노트북이 올려둔 최신 데이터를 확인 — 새 게 있으면 목록을 다시 그린다.
  //  (경주 화면을 보고 있는 중엔 화면을 뺏지 않고 저장만 해둔다)
  fetchRemote(false, function(ok){ if(ok && !CUR) renderHome(); });
})();

</script>
